name: Fetch market data (hourly during trading)

# Merged 2026-07-26 from separate quotes-hourly.yml + market-snapshot-hourly.yml
# workflows into one shared job (same shared-checkout-and-install pattern as
# fetch-daily.yml) — halves the number of distinct cron fires during the
# trading day for free. GitHub's scheduling reliability is keyed on fire
# frequency, not total workflow count (confirmed live: a 15-min schedule got
# >95% of its runs dropped, while ~8 fires/day is honored reliably), so fewer
# total fires at the same ~8/day cadence is a pure win. The two steps run
# sequentially in a fixed order instead of relying on a 1-minute cron offset
# (:16 vs :17) to land the PSEi snapshot just before the quotes board —
# sequential steps guarantee that ordering outright, no race possible.
on:
  # 2026-08-04: GitHub's native `schedule:` trigger is gone from this file —
  # even after the early-buffer fires added the same day, actual run history
  # kept showing 2h+ delays (06:00-10:00 UTC is a congested band on GitHub's
  # shared scheduled-run queue; see fetch-daily.yml's doc comment for the
  # same finding). `schedule:` fires are deprioritized best-effort in a way
  # `workflow_dispatch` isn't, so every fire is now an external cron-job.org
  # job hitting this workflow's `workflow_dispatch` REST endpoint directly
  # instead, triggered externally so GitHub's queue delay no longer applies.
  #
  # 2026-08-05: retimed from a flat hourly grid (9 fires, 8am-4pm PHT) to 10
  # fires tracking PSE's actual session boundaries instead of the clock —
  # official session times are 9:00 pre-open, 9:30 open, 12:00-1:00 lunch
  # recess (no trading), 2:45-3:00 pre-close/run-off/VWAP, 3:15 close. The
  # old hourly grid wasted fires before open and during the dead lunch hour
  # while never landing near the close.
  #
  # 2026-08-05 (later same day): doubled to 20 fires (~15 min cadence,
  # denser near session boundaries) at the user's request. Doing this safely
  # required decoupling ISR cost from fire count first — see fetch-quotes.ts's
  # triggerRevalidate call, which used to force revalidatePath on 13 pages
  # every run (13 forced writes x 20 fires/day would have ~doubled the ISR
  # Writes usage that already hit 75% of quota once, see
  # project memory / commit history around 2026-08-01). Trimmed to just "/"
  # — every other page now gets fresh data via the daily-quotes/market-snapshot
  # tags (lazy, write-on-next-visit, per Vercel's own recommended pattern)
  # instead of a forced eager regen on every fire.
  #
  # Each fire is its own cron-job.org job (mixed hour:minute pairs can't be
  # expressed in one cron schedule), all named
  # "PSEye - dispatch market-data-hourly (HH:MM ...)" on cron-job.org:
  # 9:35 (open+5), 9:50, 10:05, 10:20, 10:35, 10:50, 11:05, 11:20, 11:40,
  # 11:55 (pre-lunch), 13:05 (resume+5), 13:20, 13:35, 13:50, 14:05, 14:20,
  # 14:35, 14:55 (run-off/VWAP), 15:18 (post-close), 15:30 (settle) PHT, all
  # Mon-Fri. If cron-job.org itself ever goes down, this workflow simply
  # stops firing — there is no GitHub-native fallback anymore. See CLAUDE.md
  # for the full history.
  workflow_dispatch: {}

jobs:
  fetch-market-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # continue-on-error so one source failing doesn't skip the other — each
      # step gets an id and the "Fail job if any step failed" step below
      # re-surfaces failures to the job's own status (see fetch-daily.yml for
      # the same pattern and why it's needed for GitHub's failure email).
      - id: marketSnapshot
        run: pnpm --filter @pseye/etl fetch-market-snapshot
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - id: quotes
        run: pnpm --filter @pseye/etl fetch-quotes
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SITE_URL: ${{ secrets.SITE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}

      - name: Fail job if any step failed
        if: always()
        run: |
          for outcome in \
            "${{ steps.marketSnapshot.outcome }}" \
            "${{ steps.quotes.outcome }}"; do
            if [ "$outcome" = "failure" ]; then
              echo "At least one fetch step failed — see step logs above."
              exit 1
            fi
          done
