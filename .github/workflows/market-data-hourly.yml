name: Fetch market data (hourly during trading)

# Merged 2026-07-26 from separate quotes-hourly.yml + market-snapshot-hourly.yml
# workflows into one shared job (same shared-checkout-and-install pattern as
# fetch-daily.yml) — halves the number of distinct cron fires during the
# trading day for free. GitHub's scheduling reliability is keyed on fire
# frequency, not total workflow count (confirmed live: a 15-min schedule got
# >95% of its runs dropped, while ~8 fires/day is honored reliably), so fewer
# total fires at the same ~8/day cadence is a pure win. The two steps run
# sequentially in a fixed order instead of relying on a 1-minute cron offset
# (:16 vs :17) to land the PSEi snapshot just before the quotes board —
# sequential steps guarantee that ordering outright, no race possible.
on:
  # 2026-08-04: GitHub's native `schedule:` trigger is gone from this file —
  # even after the early-buffer fires added the same day, actual run history
  # kept showing 2h+ delays (06:00-10:00 UTC is a congested band on GitHub's
  # shared scheduled-run queue; see fetch-daily.yml's doc comment for the
  # same finding). `schedule:` fires are deprioritized best-effort in a way
  # `workflow_dispatch` isn't, so every fire that used to be a `- cron: ...`
  # line here is now an external cron-job.org job hitting this workflow's
  # `workflow_dispatch` REST endpoint directly instead — same wall-clock
  # times as before (:16 past, 00:16-08:16 UTC weekdays for the trading-day
  # cadence, plus 23:16 UTC Sun-Thu as the pre-open buffer), just triggered
  # externally so GitHub's queue delay no longer applies. If cron-job.org
  # itself ever goes down, this workflow simply stops firing — there is no
  # GitHub-native fallback anymore. See CLAUDE.md for the full history.
  workflow_dispatch: {}

jobs:
  fetch-market-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # continue-on-error so one source failing doesn't skip the other — each
      # step gets an id and the "Fail job if any step failed" step below
      # re-surfaces failures to the job's own status (see fetch-daily.yml for
      # the same pattern and why it's needed for GitHub's failure email).
      - id: marketSnapshot
        run: pnpm --filter @pseye/etl fetch-market-snapshot
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - id: quotes
        run: pnpm --filter @pseye/etl fetch-quotes
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SITE_URL: ${{ secrets.SITE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}

      - name: Fail job if any step failed
        if: always()
        run: |
          for outcome in \
            "${{ steps.marketSnapshot.outcome }}" \
            "${{ steps.quotes.outcome }}"; do
            if [ "$outcome" = "failure" ]; then
              echo "At least one fetch step failed — see step logs above."
              exit 1
            fi
          done
